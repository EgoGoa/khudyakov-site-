<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scroll-scrub demo — KHUDYAKOV.AGENCY showreel</title>
<style>
  /*
    STACK DECISION
    ---------------
    No package.json / index.html existed at this path — clean folder, so
    this is plain vanilla HTML/CSS/JS. Zero build step, zero deps: drop the
    folder anywhere (Tilda embed, Webflow custom code, a plain static host)
    and it just works.

    VIDEO DECISION
    ---------------
    Measured via a real <video> element in-browser (no ffprobe on this
    machine): assets/showreel.mp4 = 5.04s, 1244x1660, 7.58 MB.
    That's under the ~8s / ~15MB bar, so this uses DIRECT video.currentTime
    SEEKING — no frame-extraction/canvas pipeline needed. A short, light
    clip seeks fast enough on every rAF tick without visible stutter in
    Chrome/Safari/Firefox. If you swap in a longer or heavier export later
    and see seek lag, that's the signal to switch to the canvas
    frame-sequence approach instead (ffmpeg -> JPG frames -> draw on
    canvas) — direct seeking on long/heavy video is the thing that jitters.

    SMOOTHNESS ("вперёд-назад без рывков, склейка незаметна")
    ---------------
    Two techniques combine to avoid jerkiness:
    1. The scroll->time mapping is driven from a single rAF loop, not from
       the scroll event directly — scroll events can fire faster than the
       screen refreshes, causing redundant/late seeks that look like
       stutter.
    2. The current video time LERPS toward the scroll-derived target time
       instead of snapping to it. That turns any abrupt scroll jump (fast
       flick, trackpad inertia, keyboard PageDown) into a short smooth
       catch-up animation instead of a hard cut — which is what makes the
       forward/backward scrubbing read as one continuous reel rather than
       a sequence of jump-cuts.
  -->
  html, body { margin: 0; background: #0b0b10; color: #dcddef;
    font-family: -apple-system, "Inter", "Segoe UI", sans-serif; }

  .spacer { height: 60vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 0 24px; }
  .spacer h1 { font-size: clamp(28px, 5vw, 56px); font-weight: 700; letter-spacing: -0.02em; max-width: 800px; }
  .spacer p { color: rgba(220,221,239,.55); max-width: 520px; margin: 16px auto 0; line-height: 1.5; }

  /* the scrub section is tall (400vh) so there's real scroll distance to
     map onto the clip's 5s duration; the video pins via `sticky` while
     that distance is consumed */
  .scrub-section { position: relative; height: 400vh; }
  .scrub-sticky {
    position: sticky; top: 0; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  .scrub-sticky video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .scrub-hud {
    position: absolute; left: 0; right: 0; bottom: 32px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    pointer-events: none;
  }
  .scrub-track {
    width: min(480px, 70vw); height: 3px; border-radius: 999px;
    background: rgba(255,255,255,.15); overflow: hidden;
  }
  .scrub-fill { height: 100%; width: 0%; background: #00d2ff; border-radius: 999px; }
  .scrub-label { font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: rgba(220,221,239,.5); font-variant-numeric: tabular-nums; }

  .loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #000; color: rgba(220,221,239,.6); font-size: 13px; letter-spacing: .1em;
    text-transform: uppercase; transition: opacity .4s ease; z-index: 2;
  }
  .loading.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

  <div class="spacer">
    <div>
      <h1>Прокрутите вниз</h1>
      <p>Видео управляется скроллом напрямую — currentTime следует за позицией страницы, без autoplay и без цикличного повтора.</p>
    </div>
  </div>

  <section class="scrub-section" id="scrubSection">
    <div class="scrub-sticky">
      <div class="loading" id="loading">Загрузка видео…</div>
      <video id="scrubVideo" src="assets/showreel.mp4" muted playsinline preload="auto"></video>
      <div class="scrub-hud">
        <div class="scrub-track"><div class="scrub-fill" id="scrubFill"></div></div>
        <div class="scrub-label" id="scrubLabel">00:00 / 00:00</div>
      </div>
    </div>
  </section>

  <div class="spacer">
    <div>
      <h1>Дальше — обычный скролл</h1>
      <p>После scrub-секции страница возвращается к обычной прокрутке.</p>
    </div>
  </div>

<script>
(() => {
  const section = document.getElementById("scrubSection");
  const video = document.getElementById("scrubVideo");
  const fill = document.getElementById("scrubFill");
  const label = document.getElementById("scrubLabel");
  const loading = document.getElementById("loading");

  let duration = 0;
  let targetTime = 0;   // where scroll position says we should be
  let currentTime = 0;  // where the video actually is right now (lerped)
  let rafId = null;

  const fmt = (t) => {
    const s = Math.max(0, t);
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  };

  function onMetadata() {
    duration = video.duration || 0;
    video.pause();
    // seeking to a hair after 0 nudges Safari into decoding the first
    // frame immediately instead of showing a black box
    video.currentTime = 0.001;
    loading.classList.add("hidden");
    computeTarget();
    startLoop();
  }

  // scroll position -> target time, clamped to [0, duration]
  function computeTarget() {
    const rect = section.getBoundingClientRect();
    const scrollable = rect.height - window.innerHeight;
    const progress = scrollable > 0
      ? Math.min(1, Math.max(0, -rect.top / scrollable))
      : 0;
    targetTime = progress * duration;
    label.textContent = `${fmt(currentTime)} / ${fmt(duration)}`;
    fill.style.width = `${(currentTime / (duration || 1)) * 100}%`;
  }

  // single rAF loop: reads the scroll-derived target, lerps the actual
  // video time toward it, and only calls video.currentTime when the delta
  // is big enough to matter (skips redundant seeks on sub-pixel scroll)
  function tick() {
    computeTarget();
    const delta = targetTime - currentTime;
    if (Math.abs(delta) > 0.0005) {
      currentTime += delta * 0.18; // lerp factor: lower = smoother/laggier, higher = snappier/jerkier
      if (Math.abs(targetTime - currentTime) < 0.008) currentTime = targetTime;
      video.currentTime = currentTime;
    }
    rafId = requestAnimationFrame(tick);
  }

  function startLoop() {
    if (rafId) cancelAnimationFrame(rafId);
    tick();
  }

  video.addEventListener("loadedmetadata", onMetadata);
  video.addEventListener("error", () => {
    loading.textContent = "Не удалось загрузить видео";
  });
})();
</script>
</body>
</html>
