<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>Нет сети — HUD.SERVICE</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:#0b0b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .ring{width:96px;height:96px;margin:0 auto 28px;border-radius:50%;background:conic-gradient(#F5310B,#EC4899,#00D2FF,#F5310B);display:grid;place-items:center;animation:spin 6s linear infinite}
  .ring i{width:76px;height:76px;border-radius:50%;background:#0b0b10;display:block}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:clamp(26px,6vw,40px);font-weight:800;margin:0 0 12px;letter-spacing:-.01em}
  h1 b{background:linear-gradient(90deg,#F5310B,#EC4899,#00D2FF);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin:0 auto 28px;max-width:30ch;font-size:17px;font-weight:600;line-height:1.5}
  button{border:0;border-radius:999px;padding:14px 30px;font:inherit;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(90deg,#F5310B,#FF6A3D);cursor:pointer}
  @media (prefers-reduced-motion:reduce){.ring{animation:none}}
</style>
</head>
<body>
<main>
  <div class="ring" aria-hidden="true"><i></i></div>
  <h1>Нет <b>сети</b></h1>
  <p>Связь пропала. Как только интернет вернётся, HUD.SERVICE снова будет на месте.</p>
  <button type="button" onclick="location.reload()">Повторить</button>
</main>
<script>addEventListener("online",function(){location.reload()})</script>
</body>
</html>
